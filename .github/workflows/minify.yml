name: Build and Minify Assets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clean-css-cli
        run: npm install -g clean-css-cli

      - name: Minify CSS
        run: |
          mkdir -p dist
          npx clean-css-cli -o dist/style.css style.css

      - name: Copy HTML
        run: |
          cp index.html dist/ 

      - name: Commit minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build: Minify CSS to dist"
          file_pattern: "dist/*"
