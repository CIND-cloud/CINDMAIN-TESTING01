name: Auto Minify CSS

on:
  push:
    branches: [ main ]

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Auto Minify
        uses: nizarmah/auto-minify@v3
        with:
          directory: '.'
          overwrite: true
          
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Minified CSS"
